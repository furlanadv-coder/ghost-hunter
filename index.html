<h2>About Ghost Hunter</h2>

<p>
Ghost Hunter is an augmented reality entertainment experience
that uses the iPhone camera and compatible device sensors to
explore and visualize the surrounding environment.
</p>

<p>
On supported devices, LiDAR technology can provide additional
depth information and 3D spatial mapping.
</p>

<h2>Important Notice</h2>

<p>
Ghost Hunter is designed for entertainment and augmented reality
experiences. Anomaly indicators are generated through sensor data
and software processing and do not constitute evidence or proof
of paranormal phenomena.
</p>

<h2>Compatibility</h2>

<p>
Some features require an iPhone or iPad equipped with a LiDAR Scanner.
Available features may vary depending on the device.
</p>
